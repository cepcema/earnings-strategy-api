name: Update earnings calendar

on:
  workflow_dispatch:
  schedule:
    # Main daily run: Monday-Friday at 05:17 UTC
    # Madrid summer time: 07:17
    - cron: "17 5 * * 1-5"

    # Backup daily run: Monday-Friday at 07:17 UTC
    # Madrid summer time: 09:17
    # This protects us if the first GitHub scheduled run is delayed/skipped.
    - cron: "17 7 * * 1-5"

permissions:
  contents: write

jobs:
  update-earnings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run earnings update
        run: |
          python scripts/update_earnings.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/current.json docs/data/history/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update earnings calendar data"
            git push
          fi
