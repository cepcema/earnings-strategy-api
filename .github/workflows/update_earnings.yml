name: Update earnings calendar

on:
  workflow_dispatch:
  schedule:
    # TEST TODAY:
    # 09:00 UTC = 12:00 your PC time / GMT+3
    - cron: "0 9 * * 1-5"

    # Main daily run:
    # 04:23 UTC = 07:23 your PC time / GMT+3
    - cron: "23 4 * * 1-5"

    # Backup daily run:
    # 06:23 UTC = 09:23 your PC time / GMT+3
    - cron: "23 6 * * 1-5"

    # Extra backup daily run:
    # 08:23 UTC = 11:23 your PC time / GMT+3
    - cron: "23 8 * * 1-5"

permissions:
  contents: write

jobs:
  update-earnings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run earnings update
        run: |
          python scripts/update_earnings.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs/data/current.json docs/data/history/

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update earnings calendar data"
            git push
          fi
